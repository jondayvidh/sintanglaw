<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Sintanglaw</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <div class="app" id="app">

    <div class="scene-host" id="sceneHost"></div>
    <div class="scene-fallback glass" id="sceneFallback" hidden>
      <h2>3D view unavailable</h2>
      <p id="sceneFallbackText">The 3D engine could not start. Check your connection and that WebGL is enabled, then reload.</p>
    </div>

    <div class="topnav">
    <div class="nav-left">
      <header class="brand-card glass">
        <h1>Sintanglaw</h1>
      </header>
      <label class="search-pill glass">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="search" id="locationSearch" placeholder="Search location..." autocomplete="off" aria-label="Search locations" />
      </label>
    </div>

    <div class="discovery">
      <div class="discovery-row">
        <button id="sidebarToggleBtn" class="panel-toggle glass" type="button" aria-expanded="false" aria-controls="panelBody">
          <span class="panel-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            Directory
          </span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <div class="filter-wrap">
          <button id="filterBtn" class="filter-btn glass" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Filter locations" title="Filter locations">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            <span class="filter-dot" id="filterDot" hidden></span>
          </button>
          <div class="filter-menu glass" id="filterMenu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-filter="all" aria-checked="true">All locations</button>
            <button type="button" role="menuitemradio" data-filter="academic" aria-checked="false">Academic</button>
            <button type="button" role="menuitemradio" data-filter="landmark" aria-checked="false">Landmarks</button>
          </div>
        </div>
      </div>

      <aside class="panel glass is-collapsed" id="infoPanel" aria-label="Location directory and details">
        <div class="panel-body" id="panelBody">
          <article class="info-card" id="infoCard" aria-live="polite"></article>
          <div class="dir-head"><span>All locations<span class="panel-count" id="locationCounter">0 locations</span></span><span class="dir-hint">Flag = draw guide line</span></div>
          <div id="directoryList" class="directory-list" role="list"></div>
          <p class="panel-note">Building volumes are generated placeholders positioned at each marker; they are not surveyed models.</p>
        </div>
      </aside>
    </div>
    </div>

    <nav class="dock glass" aria-label="Camera controls">
      <div class="seg" role="group" aria-label="View mode">
        <button type="button" class="seg-btn" data-mode="orbit" aria-pressed="true" aria-label="Orbit view" title="Orbit view"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="2"/></svg><span class="btn-label">Orbit</span></button>
        <button type="button" class="seg-btn" data-mode="topdown" aria-pressed="false" aria-label="Top-down view" title="Top-down view"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg><span class="btn-label">Top-Down</span></button>
        <button type="button" class="seg-btn" data-mode="walking" aria-pressed="false" aria-label="Walking view" title="Walking view (W A S D to move)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="5" r="2"/><path d="M12 8l-3 5 3 2v5M12 8l3 3 3 1M9 13l-3 1"/></svg><span class="btn-label">Walking</span></button>
      </div>
      <span class="dock-sep" role="separator" aria-hidden="true"></span>
      <div class="actions" role="group" aria-label="Camera actions">
        <button type="button" class="icon-btn" id="zoomInBtn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4M11 8.500v5M8.500 11h5"/></svg></button>
        <button type="button" class="icon-btn" id="zoomOutBtn" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4M8.500 11h5"/></svg></button>
        <button type="button" class="icon-btn" id="resetZoomBtn" aria-label="Reset view" title="Reset view (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"/></svg></button>
      </div>
    </nav>

    <div class="toast glass" id="toast" role="status" hidden></div>
  </div>

  <div id="tooltip" class="tooltip glass" aria-hidden="true">
    <img id="tooltipImage" alt="" />
    <div class="tooltip-body">
      <h3 id="tooltipTitle"></h3>
      <p id="tooltipDescription"></p>
    </div>
  </div>
</body>
</html>
